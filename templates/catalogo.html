<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · Biblioteca IA</title>
    <meta name="description" content="Explorá todos los libros disponibles en la biblioteca con filtros y búsqueda avanzada.">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        /* ── Cards de libros ── */
        .libros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-top: 1.5rem;
        }
        .libro-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.4rem;
            transition: all 0.2s; cursor: pointer;
            display: flex; flex-direction: column; gap: 0.6rem;
        }
        .libro-card:hover { transform: translateY(-3px); box-shadow: var(--sombra-hover); border-color: rgba(59,130,246,0.3); }
        .libro-card-titulo { font-weight: 700; color: var(--text-heading); font-size: 0.95rem; line-height: 1.4; }
        .libro-card-autor  { font-size: 0.82rem; color: var(--text-muted); }
        .libro-card-cat    { font-size: 0.75rem; color: var(--azul-claro); font-weight: 600; }
        .libro-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 0.6rem; border-top: 1px solid var(--border); }
        .libro-card-editorial { font-size: 0.75rem; color: var(--text-muted); }

        /* ── Filtros ── */
        .filtros-bar { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
        .filtro-select {
            padding: 8px 12px; background: var(--bg-input); border: 1.5px solid var(--border);
            border-radius: 8px; color: var(--text-heading); font-size: 0.9rem; outline: none; cursor: pointer;
        }
        .filtro-select:focus { border-color: var(--azul-claro); }
        .filtro-btn {
            padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--border);
            background: var(--bg-input); color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 600;
            transition: all 0.15s;
        }
        .filtro-btn.active { background: rgba(59,130,246,0.15); color: var(--azul-claro); border-color: var(--azul-claro); }
        .resultado-count { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }

        /* ── Modal detalle libro ── */
        .modal-detalle { display: none; position: fixed; inset: 0; z-index: 3000;
            background: rgba(2,6,23,0.8); backdrop-filter: blur(4px);
            align-items: center; justify-content: center; padding: 1rem; }
        .modal-detalle.open { display: flex; }
        .modal-detalle-content {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); width: 100%; max-width: 540px;
            max-height: 88vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); padding: 2rem; position: relative;
        }
        .detalle-close { position: absolute; top: 14px; right: 18px; background: none; border: none;
            color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
        .detalle-close:hover { color: var(--rojo); }
        .detalle-cat   { color: var(--azul-claro); font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; }
        .detalle-titulo { font-size: 1.3rem; font-weight: 800; color: var(--text-heading); margin-bottom: 0.3rem; }
        .detalle-autor  { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }
        .detalle-row    { display: flex; justify-content: space-between; padding: 8px 0;
                          border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .detalle-row:last-child { border: none; }
        .detalle-label  { color: var(--text-muted); }
        .detalle-value  { color: var(--text-heading); font-weight: 500; text-align: right; }
        .detalle-caps   { margin-top: 1rem; }
        .detalle-caps h4 { color: var(--azul-claro); font-size: 0.88rem; margin-bottom: 0.6rem; }
        .cap-item { padding: 5px 10px; background: var(--bg-input); border-radius: 6px;
                    font-size: 0.82rem; color: var(--text-main); margin-bottom: 4px; }
        .btn-reservar-detalle {
            width: 100%; padding: 12px; margin-top: 1.2rem;
            background: var(--azul-claro); color: #fff; border: none;
            border-radius: 50px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .btn-reservar-detalle:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-reservar-detalle:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="logo"><span class="logo-icon">📚</span><h1>Catálogo</h1></div>
            <div id="user-menu"></div>
        </div>
        <nav class="header-nav"><div class="header-nav-inner">
            <a href="/" class="nav-link">Inicio</a>
            <a href="/checkin" class="nav-link">Check-in</a>
            <a href="/resenas" class="nav-link" id="nav-resenas" style="display:none;">Reseñas</a>
            <a href="/catalogo" class="nav-link active" id="nav-catalogo" style="display:none;">Catálogo</a>
            <a href="/mis-prestamos" class="nav-link" id="nav-prestamos" style="display:none;">Mis Préstamos</a>
            <a href="/dashboard" class="nav-link dashboard-link" id="nav-dashboard" style="display:none;">Dashboard</a>
            <a href="/registro" class="nav-link" id="nav-registro" style="display:none;">Registrar Alumno</a>
            <a href="/libros" class="nav-link" id="nav-libros" style="display:none;">Libros</a>
        </div></nav>
    </header>

    <!-- MODAL DETALLE LIBRO -->
    <div id="modal-detalle" class="modal-detalle">
        <div class="modal-detalle-content">
            <button class="detalle-close" onclick="cerrarDetalle()">✕</button>
            <div class="detalle-cat"  id="d-cat"></div>
            <div class="detalle-titulo" id="d-titulo"></div>
            <div class="detalle-autor"  id="d-autor"></div>
            <div id="d-rows"></div>
            <div class="detalle-caps" id="d-caps-wrap" style="display:none;">
                <h4>Contenido</h4>
                <div id="d-caps"></div>
            </div>
            <button class="btn-reservar-detalle" id="btn-reservar-detalle" onclick="irACheckin()">
                Reservar este libro
            </button>
        </div>
    </div>

    <!-- MODAL LOGIN -->
    <div id="login-modal" class="modal">
        <div class="modal-content login-content">
            <span class="close-modal" id="close-login">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group"><label>Usuario</label><input type="text" id="login-username" required placeholder="Tu usuario"></div>
                <div class="form-group"><label>Contraseña</label>
                    <div style="position:relative;">
                        <input type="password" id="login-password" required placeholder="Tu contraseña" style="padding-right:48px;">
                        <button type="button" id="btn-toggle-pass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--azul-claro);padding:0;display:flex;align-items:center;">
                            <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%">Ingresar</button>
            </form>
            <div id="login-error" class="error-msg" style="display:none;"></div>
            <div class="google-divider">o ingresá con</div>
            <a href="/auth/google" class="btn-google">
                <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Continuar con Google
            </a>
            <p class="google-note">Solo disponible para alumnos</p>
        </div>
    </div>

    <main class="dashboard-main">
        <h2>Catálogo de Libros</h2>
        <p style="color:var(--text-muted);margin-bottom:1.2rem;">Tocá cualquier libro para ver el detalle completo.</p>

        <!-- FILTROS -->
        <div class="filtros-bar">
            <input type="text" id="catalogo-search" class="search-input" placeholder="Buscar por título, autor..." style="flex:1;min-width:200px;">
            <select id="filtro-categoria" class="filtro-select">
                <option value="">Todas las categorías</option>
            </select>
            <button class="filtro-btn active" id="btn-todos" onclick="setDisponibilidad('')">Todos</button>
            <button class="filtro-btn" id="btn-disponibles" onclick="setDisponibilidad('si')">Disponibles</button>
        </div>

        <div class="resultado-count" id="resultado-count"></div>
        <div class="libros-grid" id="libros-grid"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <script>
    function togglePass() {
        var inp = document.getElementById('login-password');
        var eyeOn = document.getElementById('icon-eye');
        var eyeOff = document.getElementById('icon-eye-off');
        if (!inp) return;
        if (inp.type === 'password') { inp.type = 'text'; eyeOn.style.display='none'; eyeOff.style.display='block'; }
        else { inp.type = 'password'; eyeOn.style.display='block'; eyeOff.style.display='none'; }
    }
    document.addEventListener('click', function(e) { if (e.target.closest('#btn-toggle-pass')) togglePass(); });
    </script>
    <script src="/static/js/auth.js"></script>
    <script>
    let currentPage = 1, perPage = 24, filtroDisp = '', libroSeleccionado = null;

    async function loadCatalogo(page = 1) {
        currentPage = page;
        const busqueda  = document.getElementById('catalogo-search').value.trim();
        const categoria = document.getElementById('filtro-categoria').value;
        let url = `/api/libros?page=${page}&per_page=${perPage}&busqueda=${encodeURIComponent(busqueda)}`;
        if (categoria) url += `&categoria=${encodeURIComponent(categoria)}`;
        if (filtroDisp === 'si') url += '&solo_disponibles=1';

        const res  = await fetch(url);
        const data = await res.json();
        const grid = document.getElementById('libros-grid');

        document.getElementById('resultado-count').textContent = `${data.total} libro${data.total !== 1 ? 's' : ''} encontrado${data.total !== 1 ? 's' : ''}`;

        if (!data.libros.length) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);">No se encontraron libros con ese filtro.</div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        grid.innerHTML = data.libros.map(l => `
            <div class="libro-card" onclick="abrirDetalle(${l.id})">
                <div class="libro-card-cat">${l.categoria || 'Sin categoría'}</div>
                <div class="libro-card-titulo">${l.titulo}</div>
                <div class="libro-card-autor">${l.autor || ''}</div>
                <div class="libro-card-footer">
                    <span class="libro-card-editorial">${l.editorial || ''}</span>
                    <span class="badge ${l.disponible > 0 ? 'disponible' : 'no-disponible'}">
                        ${l.disponible > 0 ? l.disponible + ' disponible' + (l.disponible > 1 ? 's' : '') : 'Sin stock'}
                    </span>
                </div>
            </div>`).join('');

        // Paginación
        const total = data.total_pages;
        let pages = `<button class="page-btn" onclick="loadCatalogo(${page-1})" ${page===1?'disabled':''}>◀</button>`;
        for (let i = 1; i <= total; i++) {
            if (i===1||i===total||(i>=page-1&&i<=page+1)) pages += `<button class="page-btn ${i===page?'active':''}" onclick="loadCatalogo(${i})">${i}</button>`;
            else if (i===page-2||i===page+2) pages += `<span style="padding:8px">...</span>`;
        }
        pages += `<button class="page-btn" onclick="loadCatalogo(${page+1})" ${page===total?'disabled':''}>▶</button>`;
        document.getElementById('pagination').innerHTML = pages;
    }

    async function cargarCategorias() {
        const res  = await fetch('/api/libros?per_page=500');
        const data = await res.json();
        const cats = [...new Set((data.libros||[]).map(l=>l.categoria).filter(Boolean))].sort();
        const sel  = document.getElementById('filtro-categoria');
        cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
    }

    function setDisponibilidad(val) {
        filtroDisp = val;
        document.getElementById('btn-todos').classList.toggle('active', val === '');
        document.getElementById('btn-disponibles').classList.toggle('active', val === 'si');
        loadCatalogo(1);
    }

    // ── Detalle libro ────────────────────────────────────────
    let _librosCache = [];
    async function abrirDetalle(id) {
        if (!_librosCache.length) {
            const res = await fetch('/api/libros?per_page=500');
            const d   = await res.json();
            _librosCache = d.libros || [];
        }
        const libro = _librosCache.find(l => l.id === id);
        if (!libro) return;
        libroSeleccionado = libro;

        document.getElementById('d-cat').textContent    = libro.categoria || '';
        document.getElementById('d-titulo').textContent = libro.titulo || '';
        document.getElementById('d-autor').textContent  = libro.autor ? 'Por ' + libro.autor : '';

        document.getElementById('d-rows').innerHTML = `
            <div class="detalle-row"><span class="detalle-label">Editorial</span><span class="detalle-value">${libro.editorial || '-'}</span></div>
            <div class="detalle-row"><span class="detalle-label">Disponibilidad</span><span class="detalle-value">${libro.disponible > 0 ? libro.disponible + ' en stock' : 'Sin stock'}</span></div>
        `;

        // Capítulos / bloques
        const capsWrap = document.getElementById('d-caps-wrap');
        const capsDiv  = document.getElementById('d-caps');
        if (libro.capitulo && libro.capitulo.trim()) {
            const raw = libro.capitulo;
            if (raw.includes('BLOQUE:')) {
                const bloques = raw.split('---').filter(b => b.trim());
                capsDiv.innerHTML = bloques.map(b => {
                    const lines = b.split('||');
                    const nombre = lines[0].replace('BLOQUE:', '').trim();
                    const caps   = lines.slice(1).filter(c => c.trim());
                    return `<div style="margin-bottom:0.8rem;"><div style="font-weight:700;color:var(--azul-claro);font-size:0.85rem;margin-bottom:4px;">${nombre}</div>` +
                           caps.map(c => `<div class="cap-item">${c}</div>`).join('') + '</div>';
                }).join('');
            } else {
                const caps = raw.split('||').filter(c => c.trim());
                capsDiv.innerHTML = caps.map((c, i) => `<div class="cap-item">${i+1}. ${c}</div>`).join('');
            }
            capsWrap.style.display = 'block';
        } else {
            capsWrap.style.display = 'none';
        }

        const btnRes = document.getElementById('btn-reservar-detalle');
        btnRes.disabled = libro.disponible <= 0;
        btnRes.textContent = libro.disponible > 0 ? 'Reservar este libro' : 'Sin stock disponible';

        document.getElementById('modal-detalle').classList.add('open');
    }

    function cerrarDetalle() {
        document.getElementById('modal-detalle').classList.remove('open');
        libroSeleccionado = null;
    }

    function irACheckin() {
        window.location.href = '/checkin';
    }

    document.getElementById('modal-detalle').addEventListener('click', function(e) {
        if (e.target === this) cerrarDetalle();
    });

    // ── Búsqueda con debounce ────────────────────────────────
    let debounce = null;
    document.getElementById('catalogo-search').addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => { _librosCache = []; loadCatalogo(1); }, 350);
    });
    document.getElementById('filtro-categoria').addEventListener('change', () => { _librosCache = []; loadCatalogo(1); });

    cargarCategorias();
    loadCatalogo(1);
    </script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');</script>
</body>
</html>
