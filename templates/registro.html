<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Alumno · Biblioteca IA</title>
    <meta name="description" content="Alta de nuevos alumnos en el sistema de biblioteca.">
    <meta property="og:title" content="Registrar Alumno · Biblioteca IA">
    <meta property="og:description" content="Alta de nuevos alumnos en el sistema de biblioteca.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="logo"><span class="logo-icon">📚</span><h1>Registrar Alumno</h1></div>
            <div id="user-menu"></div>
        </div>

        <nav class="header-nav"><div class="header-nav-inner">
            <a href="/" class="nav-link">Inicio</a>
            <a href="/checkin" class="nav-link">Check-in</a>
            <a href="/resenas" class="nav-link" id="nav-resenas" style="display:none;">Reseñas</a>
            <a href="/dashboard" class="nav-link dashboard-link">Dashboard</a>
            <a href="/registro" class="nav-link active">Registrar Alumno</a>
            <a href="/libros" class="nav-link" id="nav-libros" style="display:none;">Libros</a>
        </div></nav>
    </header>

    <main class="checkin-main">
        <div class="checkin-card" style="max-width:600px; margin:0 auto;">
            <h2>👤 Nuevo Alumno</h2>
            <form id="register-form">
                <div class="form-group"><label>Nombre</label><input type="text" id="reg-nombre" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
                <div class="form-group"><label>Usuario</label><input type="text" id="reg-username" required></div>
                <div class="form-group"><label>Contraseña</label><input type="password" id="reg-password" required></div>
                <button type="submit" class="btn-primary" style="width:100%">Registrar</button>
            </form>
            <div id="reg-msg" class="success-msg" style="display:none;"></div>
        </div>
        <div class="checkin-card" style="margin-top:2rem;">
            <h2>📋 Alumnos Registrados</h2>
            <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.8rem;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:4px;box-shadow:0 0 6px #22c55e;"></span>Online ahora &nbsp;&nbsp;<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#475569;margin-right:4px;"></span>Offline</div><div class="table-container"><table class="data-table"><thead><tr><th>Nombre</th><th>Usuario</th><th>Email</th><th>Acciones</th></tr></thead><tbody id="alumnos-list"></tbody></table></div>
        </div>
    </main>

    <script>
    window.modalConfirm = function(o) {
        return new Promise(function(resolve) {
            var overlay = document.createElement('div');
            overlay.className = 'custom-modal-overlay';
            overlay.innerHTML = '<div class="custom-modal-box"><span class="custom-modal-icon">'+(o.icono||'❓')+'</span><div class="custom-modal-title">'+(o.titulo||'Confirmá')+'</div><div class="custom-modal-msg">'+(o.mensaje||'')+'</div><div class="custom-modal-btns"><button class="custom-modal-btn-cancel" id="cm-no">'+(o.btnNo||'Cancelar')+'</button><button class="custom-modal-btn-confirm '+(o.peligro?'danger':'')+'" id="cm-si">'+(o.btnOk||'Confirmar')+'</button></div></div>';
            document.body.appendChild(overlay);
            function cerrar(r){ document.body.removeChild(overlay); resolve(r); }
            overlay.querySelector('#cm-si').onclick = function(){ cerrar(true); };
            overlay.querySelector('#cm-no').onclick = function(){ cerrar(false); };
            overlay.onclick = function(e){ if(e.target===overlay) cerrar(false); };
        });
    };
    window.modalAlert = function(o) {
        return new Promise(function(resolve) {
            var iconos = {success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};
            var overlay = document.createElement('div');
            overlay.className = 'custom-modal-overlay';
            overlay.innerHTML = '<div class="custom-modal-box"><span class="custom-modal-icon">'+(iconos[o.tipo]||'ℹ️')+'</span><div class="custom-modal-title">'+(o.titulo||'Aviso')+'</div><div class="custom-modal-msg">'+(o.mensaje||'')+'</div><div class="custom-modal-btns"><button class="custom-modal-btn-ok" id="cm-ok">Entendido</button></div></div>';
            document.body.appendChild(overlay);
            function cerrar(){ document.body.removeChild(overlay); resolve(); }
            overlay.querySelector('#cm-ok').onclick = cerrar;
            overlay.onclick = function(e){ if(e.target===overlay) cerrar(); };
        });
    };
    </script>
    <script src="/static/js/auth.js"></script>
    <script>
        document.getElementById('register-form').onsubmit = async e => {
            e.preventDefault();
            const res = await fetch('/api/registro', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
                nombre: document.getElementById('reg-nombre').value,
                email: document.getElementById('reg-email').value,
                username: document.getElementById('reg-username').value,
                password: document.getElementById('reg-password').value
            })});
            const data = await res.json();
            const msg = document.getElementById('reg-msg');
            msg.textContent = data.mensaje || data.error;
            msg.style.display = 'block';
            if(res.ok) { e.target.reset(); loadAlumnos(); }
        };
        function renderFila(a, isOnline) {
            var dot = isOnline
                ? '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;margin-right:8px;box-shadow:0 0 6px #22c55e;flex-shrink:0;"></span>'
                : '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#334155;margin-right:8px;flex-shrink:0;"></span>';
            var status = isOnline
                ? '<span style="font-size:0.72rem;color:#22c55e;font-weight:700;background:rgba(34,197,94,0.1);padding:2px 8px;border-radius:20px;">Online</span>'
                : '<span style="font-size:0.72rem;color:#64748b;font-weight:600;background:rgba(71,85,105,0.1);padding:2px 8px;border-radius:20px;">Offline</span>';
            var rowBg = isOnline ? 'background:rgba(34,197,94,0.03);' : '';
            var tr = document.createElement('tr');
            tr.style.cssText = rowBg;
            var td1 = document.createElement('td');
            td1.style.cssText = 'display:flex;align-items:center;font-size:0.92rem;font-weight:500;';
            td1.innerHTML = dot + (a.nombre||'-');
            var td2 = document.createElement('td');
            td2.style.fontSize = '0.88rem';
            td2.textContent = a.username || 'Google OAuth';
            var td3 = document.createElement('td');
            td3.style.cssText = 'font-size:0.85rem;color:var(--text-muted);';
            td3.textContent = a.email || '-';
            var td4 = document.createElement('td');
            var btn = document.createElement('button');
            btn.textContent = 'Eliminar';
            btn.style.cssText = 'padding:4px 10px;background:transparent;border:1.5px solid #7f1d1d;color:#f87171;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:600;margin-left:6px;';
            btn.onmouseover = function(){ this.style.background = '#7f1d1d'; };
            btn.onmouseout  = function(){ this.style.background = 'transparent'; };
            btn.onclick = function(){ eliminarAlumno(a.id, a.nombre||''); };
            td4.innerHTML = status + ' ';
            td4.appendChild(btn);
            tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4);
            return tr.outerHTML;
        }

        async function loadAlumnos() {
            try {
                var uRes = await fetch('/api/usuarios');
                var usuarios = await uRes.json();
                var onlineIds = new Set();
                try {
                    var oRes = await fetch('/api/alumnos/online');
                    var online = await oRes.json();
                    online.forEach(function(o){ onlineIds.add(o.id); });
                } catch(e) {}
                var alumnos = usuarios.filter(function(x){ return x.rol === 'alumno'; });
                var online_list = alumnos.filter(function(a){ return onlineIds.has(a.id); });
                var offline_list = alumnos.filter(function(a){ return !onlineIds.has(a.id); });
                online_list.sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||''); });
                offline_list.sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||''); });
                document.querySelector('.checkin-card:last-child h2').innerHTML =
                    '📋 Alumnos Registrados &nbsp;'
                    + '<span style="font-size:0.85rem;background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.3);border-radius:20px;padding:2px 10px;font-weight:600;">'
                    + online_list.length + ' online</span>'
                    + ' &nbsp;<span style="font-size:0.85rem;background:rgba(71,85,105,0.2);color:#94a3b8;border:1px solid #334155;border-radius:20px;padding:2px 10px;font-weight:600;">'
                    + offline_list.length + ' offline</span>';
                var tbody = document.getElementById('alumnos-list');
                var allAlumnos = online_list.concat(offline_list);
                tbody.innerHTML = '';
                if(!allAlumnos.length) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:1.5rem;">No hay alumnos registrados</td></tr>';
                } else {
                    // Separador online
                    if(online_list.length) {
                        var sepOn = '<tr><td colspan="4" style="background:rgba(34,197,94,0.08);padding:6px 12px;font-size:0.75rem;font-weight:700;color:#22c55e;letter-spacing:0.08em;text-transform:uppercase;">🟢 Online ahora (' + online_list.length + ')</td></tr>';
                        tbody.innerHTML += sepOn;
                    }
                    var dummy = allAlumnos.map(function(a) {
                        var isOnline = onlineIds.has(a.id);
                        var dot = isOnline
                            ? '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;margin-right:8px;box-shadow:0 0 6px #22c55e;flex-shrink:0;animation:pulse 2s infinite;"></span>'
                            : '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#334155;margin-right:8px;flex-shrink:0;"></span>';
                        var nombreSafe = (a.nombre||'').replace(/'/g,'');
                        var rowStyle = isOnline ? 'background:rgba(34,197,94,0.04);' : '';
                        var btn = document.createElement('button');
                        btn.textContent = 'Eliminar';
                        btn.style.cssText = 'padding:4px 12px;background:transparent;border:1.5px solid #7f1d1d;color:#f87171;border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:600;';
                        btn.onmouseover = function(){ this.style.background='#7f1d1d'; };
                        btn.onmouseout  = function(){ this.style.background='transparent'; };
                        btn.onclick = function(){ eliminarAlumno(a.id, a.nombre||''); };
                        var tr = document.createElement('tr');
                        if(rowStyle) tr.style.background = 'rgba(34,197,94,0.04)';
                        var td1 = document.createElement('td'); td1.style.display='flex'; td1.style.alignItems='center';
                        td1.innerHTML = dot; td1.appendChild(document.createTextNode(a.nombre||'-'));
                        var td2 = document.createElement('td'); td2.textContent = a.username || 'Google OAuth';
                        var td3 = document.createElement('td'); td3.textContent = a.email||'-';
                        var td4 = document.createElement('td'); td4.appendChild(btn);
                        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4);
                        return tr.outerHTML;
                    }).join('');
                    // Insertar separador offline en la posición correcta
                    var rows = '';
                    online_list.forEach(function(a){ rows += renderFila(a, true); });
                    if(offline_list.length) {
                        rows += '<tr><td colspan="4" style="background:rgba(71,85,105,0.1);padding:6px 12px;font-size:0.75rem;font-weight:700;color:#64748b;letter-spacing:0.08em;text-transform:uppercase;">⚫ Offline (' + offline_list.length + ')</td></tr>';
                    }
                    offline_list.forEach(function(a){ rows += renderFila(a, false); });
                    tbody.innerHTML = rows;
                }
                var dummy2 = '';
            } catch(e) { console.error('Error cargando alumnos:', e); }
        }
        loadAlumnos();
        setInterval(loadAlumnos, 10000);

        // Heartbeat: actualiza ultimo_acceso cada 30s mientras la página está abierta
        async function heartbeat() {
            try { await fetch('/api/session'); } catch(e) {}
        }
        heartbeat();
        setInterval(heartbeat, 30000);

        // Cuando el usuario cierra la pestaña, marcar como offline
        document.addEventListener('visibilitychange', function() {
            if(!document.hidden) heartbeat();
        });

        async function eliminarAlumno(id, nombre) {
            const ok = await modalConfirm({
                titulo: 'Eliminar alumno',
                mensaje: '¿Seguro que querés eliminar la cuenta de ' + nombre + '? Se borrarán sus reservas, reseñas e historial.',
                icono: '🗑️', peligro: true, btnOk: 'Eliminar', btnNo: 'Cancelar'
            });
            if (!ok) return;
            try {
                const res  = await fetch('/api/usuarios/' + id, { method: 'DELETE', credentials: 'include' });
                const data = await res.json();
                if (res.ok) {
                    await modalAlert({ titulo: 'Listo', mensaje: data.mensaje || 'Usuario eliminado.', tipo: 'success' });
                    loadAlumnos();
                } else {
                    await modalAlert({ titulo: 'Error', mensaje: data.error || 'No se pudo eliminar.', tipo: 'error' });
                }
            } catch(e) {
                await modalAlert({ titulo: 'Error', mensaje: 'Error de conexión.', tipo: 'error' });
            }
        }

    </script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');</script>
</body>
</html>
